name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - feature/bootstrap

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks redacted scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.21.2 \
            detect \
            --source /repo \
            --config /repo/templates/security/gitleaks.toml \
            --redact=100 \
            --report-format json \
            --report-path /repo/gitleaks-redacted.json \
            --exit-code 1

      - name: Upload redacted scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-redacted-report
          path: gitleaks-redacted.json
          if-no-files-found: ignore
