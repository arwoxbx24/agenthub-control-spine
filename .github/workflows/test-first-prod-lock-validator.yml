name: test-first-prod-lock-validator

on:
  push:
    branches:
      - agenthub/AH-794-test-first-prod-lock-20260614
  pull_request:
    paths:
      - 'governance/test-first-prod-deploy-lock-policy.md'
      - 'schemas/environment_route_proof.schema.json'
      - 'schemas/workflow_impact_audit.schema.json'
      - 'schemas/release_approval_gate.schema.json'
      - 'schemas/test_acceptance_proof.schema.json'
      - 'validators/test_first_prod_deploy_lock_validator.rb'
      - 'fixtures/test-first-prod-deploy-lock/fixtures.json'
      - 'runbooks/test-first-release-gate-runbook.md'
      - 'prompts/templates/test-first-release-worker-template.md'
      - 'prompts/templates/owner-test-confirmation-request-template.md'
      - 'registries/test-first-prod-deploy-lock-coverage-20260614.md'
      - 'reports/incidents/AH-794-prod-crossing-incident-analysis-20260614.md'
      - 'reports/validations/AH-794-test-first-prod-lock-validation-20260614.md'
      - 'reports/receipts/AH-794-test-first-prod-lock-receipt-20260614.md'
      - 'INDEX.md'
      - 'ARTIFACT_REGISTER.md'
      - 'PR_QUEUE_REGISTER.md'
      - '.github/workflows/test-first-prod-lock-validator.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    name: test-first-prod-lock-validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Add AH-794 register coverage if missing
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if ! grep -q 'AH-794 Test-First Production Deploy Lock Coverage' INDEX.md; then
            cat >> INDEX.md <<'EOF'

## AH-794 Test-First Production Deploy Lock Coverage

| Artifact | Type | Source task | Status |
|---|---|---|---|
| `governance/test-first-prod-deploy-lock-policy.md` | governance policy | AH-794 | active-control-candidate |
| `schemas/environment_route_proof.schema.json` | schema | AH-794 | active-control-candidate |
| `schemas/workflow_impact_audit.schema.json` | schema | AH-794 | active-control-candidate |
| `schemas/release_approval_gate.schema.json` | schema | AH-794 | active-control-candidate |
| `schemas/test_acceptance_proof.schema.json` | schema | AH-794 | active-control-candidate |
| `validators/test_first_prod_deploy_lock_validator.rb` | validator | AH-794 | active-control-candidate |
| `fixtures/test-first-prod-deploy-lock/fixtures.json` | eval fixtures | AH-794 | active-control-candidate |
| `runbooks/test-first-release-gate-runbook.md` | runbook | AH-794 | active-control-candidate |
| `prompts/templates/test-first-release-worker-template.md` | worker template | AH-794 | active-control-candidate |
| `prompts/templates/owner-test-confirmation-request-template.md` | owner template | AH-794 | active-control-candidate |
| `registries/test-first-prod-deploy-lock-coverage-20260614.md` | coverage register | AH-794 | active-control-candidate |
| `reports/incidents/AH-794-prod-crossing-incident-analysis-20260614.md` | incident analysis | AH-794 | audit-only |
| `reports/validations/AH-794-test-first-prod-lock-validation-20260614.md` | validation report | AH-794 | operational-receipt |
| `reports/receipts/AH-794-test-first-prod-lock-receipt-20260614.md` | implementation receipt | AH-794 | operational-receipt |
EOF
          fi
          if ! grep -q 'AH-794 Test-First Production Deploy Lock Coverage' ARTIFACT_REGISTER.md; then
            cat >> ARTIFACT_REGISTER.md <<'EOF'

## AH-794 Test-First Production Deploy Lock Coverage

| Artifact | Lifecycle | Default load | Safe to replay | Source task | Notes |
|---|---|---:|---:|---|---|
| `governance/test-first-prod-deploy-lock-policy.md` | `active_policy` | false | false | AH-794 | Test-first production deployment lock policy; main/master and unknown routes are production-risk. |
| `schemas/environment_route_proof.schema.json` | `active_control` | false | false | AH-794 | Schema for mandatory test-only route proof. |
| `schemas/workflow_impact_audit.schema.json` | `active_control` | false | false | AH-794 | Schema for workflow YAML/default-branch/environment/secrets impact audit. |
| `schemas/release_approval_gate.schema.json` | `active_control` | false | false | AH-794 | Schema requiring test proof plus exact owner phrase before production release. |
| `schemas/test_acceptance_proof.schema.json` | `active_control` | false | false | AH-794 | Schema for browser/user/owner test acceptance evidence. |
| `validators/test_first_prod_deploy_lock_validator.rb` | `active_control` | false | false | AH-794 | Deterministic validator for production lock fixtures. |
| `fixtures/test-first-prod-deploy-lock/fixtures.json` | `active_control` | false | false | AH-794 | Required 12-case fixture pack. |
| `runbooks/test-first-release-gate-runbook.md` | `active_control` | false | false | AH-794 | Test-first release gate runbook. |
| `prompts/templates/test-first-release-worker-template.md` | `active_control` | false | false | AH-794 | Worker template with pre-action route proof and workflow impact audit. |
| `prompts/templates/owner-test-confirmation-request-template.md` | `active_control` | false | false | AH-794 | Owner test confirmation request template; not production approval. |
| `registries/test-first-prod-deploy-lock-coverage-20260614.md` | `current_baseline` | false | false | AH-794 | Coverage register for AH-794 package. |
| `reports/incidents/AH-794-prod-crossing-incident-analysis-20260614.md` | `audit_only` | false | false | AH-794 | Evidence-backed incident analysis for AH-793 production crossing. |
| `reports/validations/AH-794-test-first-prod-lock-validation-20260614.md` | `operational_receipt` | false | false | AH-794 | Validation report for fixture coverage and CI validator route. |
| `reports/receipts/AH-794-test-first-prod-lock-receipt-20260614.md` | `operational_receipt` | false | false | AH-794 | Implementation receipt; proof only, not a prompt. |
EOF
          fi
          if ! grep -q 'AH-794 Test-First Production Deploy Lock' PR_QUEUE_REGISTER.md; then
            cat >> PR_QUEUE_REGISTER.md <<'EOF'

## AH-794 Test-First Production Deploy Lock

| PR | Task id | RUN_ID | Branch | Owner role | Queue class | Registrar action | Evidence link | Blocker |
|---|---|---|---|---|---|---|---|---|
| `#171` | `AH-794` | `AH-PROD-LOCK-TEST-FIRST-GOVERNANCE-20260614` | `agenthub/AH-794-test-first-prod-lock-20260614` | T1 Architect / T2 Worker / Verifier / Registrar | `MERGE_READY_AFTER_VALIDATION` | Installs test-first production deployment lock governance after AH-793 production crossing. Requires validator workflow and gitleaks PASS before merge. | Policy, schemas, validator, fixtures, runbook/templates, incident analysis, validation report, receipt, coverage register. | none after CI validation PASS |
EOF
          fi

      - name: Run deterministic validator
        run: ruby validators/test_first_prod_deploy_lock_validator.rb fixtures/test-first-prod-deploy-lock/fixtures.json

      - name: Commit register coverage
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --quiet -- INDEX.md ARTIFACT_REGISTER.md PR_QUEUE_REGISTER.md; then
            echo 'Register coverage already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add INDEX.md ARTIFACT_REGISTER.md PR_QUEUE_REGISTER.md
          git commit -m 'AH-794 add register coverage'
          git push
