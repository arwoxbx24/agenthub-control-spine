name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  statuses: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks redacted scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.21.2 \
            detect \
            --source /repo \
            --redact=100 \
            --report-format json \
            --report-path /repo/gitleaks-redacted.json \
            --exit-code 1

      - name: Publish legacy gitleaks commit status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_SHA: ${{ github.sha }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for STATUS_SHA in "$HEAD_SHA" "$MERGE_SHA"; do
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${STATUS_SHA}" \
              -d "{\"state\":\"success\",\"context\":\"gitleaks\",\"description\":\"gitleaks redacted scan passed\",\"target_url\":\"${STATUS_URL}\"}"
          done

      - name: Upload redacted scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-redacted-report
          path: gitleaks-redacted.json
          if-no-files-found: ignore