name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  statuses: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks redacted scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.21.2 \
            detect \
            --source /repo \
            --redact=100 \
            --report-format json \
            --report-path /repo/gitleaks-redacted.json \
            --exit-code 1

      - name: Publish legacy gitleaks commit status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_SHA: ${{ github.sha }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for STATUS_SHA in "$HEAD_SHA" "$MERGE_SHA"; do
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${STATUS_SHA}" \
              -d "{\"state\":\"success\",\"context\":\"gitleaks\",\"description\":\"gitleaks redacted scan passed\",\"target_url\":\"${STATUS_URL}\"}"
          done

      - name: Upload redacted scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-redacted-report
          path: gitleaks-redacted.json
          if-no-files-found: ignore

  ah794-test-first-prod-lock:
    name: AH-794 test-first production lock validator
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR content
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect AH-794 validator package
        id: detect
        run: |
          if [ -f validators/test_first_prod_deploy_lock_validator.rb ] && [ -f fixtures/test-first-prod-deploy-lock/fixtures.json ]; then
            echo "prod_lock_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "prod_lock_present=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f validators/owner_output_hardlock_validator.rb ] && [ -f fixtures/owner-output-hardlock/fixtures.json ]; then
            echo "owner_output_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "owner_output_present=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f validators/architect_brain_methodology_validator.rb ] && [ -f fixtures/architect-brain-methodology/fixtures.json ]; then
            echo "architect_brain_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "architect_brain_present=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f validators/protected_link_agenthub_route_validator.rb ] && [ -f fixtures/protected-link-agenthub-route/fixtures.json ]; then
            echo "protected_link_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "protected_link_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AH-794 deterministic validator
        if: steps.detect.outputs.prod_lock_present == 'true'
        run: ruby validators/test_first_prod_deploy_lock_validator.rb fixtures/test-first-prod-deploy-lock/fixtures.json

      - name: Run owner output hardlock validator
        if: steps.detect.outputs.owner_output_present == 'true'
        run: ruby validators/owner_output_hardlock_validator.rb fixtures/owner-output-hardlock/fixtures.json

      - name: Run Architect Brain methodology validator
        if: steps.detect.outputs.architect_brain_present == 'true'
        run: ruby validators/architect_brain_methodology_validator.rb fixtures/architect-brain-methodology/fixtures.json

      - name: Run protected-link AgentHub route validator
        if: steps.detect.outputs.protected_link_present == 'true'
        run: ruby validators/protected_link_agenthub_route_validator.rb fixtures/protected-link-agenthub-route/fixtures.json

      - name: Skip when AH-794 packages are absent
        if: steps.detect.outputs.prod_lock_present != 'true' && steps.detect.outputs.owner_output_present != 'true' && steps.detect.outputs.architect_brain_present != 'true' && steps.detect.outputs.protected_link_present != 'true'
        run: echo 'AH-794 validator packages absent; skipping.'
